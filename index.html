<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川崎ヤング_会員ページ</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
  .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; /* 全体を中央揃えにする設定 */ }
  
  /* ★ロゴ画像のスタイル設定 */
  .logo {
    display: block;
    margin: 0 auto 20px; /* 中央に配置し、下に余白を作る */
    max-width: 150px; /* ロゴの最大幅（必要に応じて調整してください） */
    height: auto;
  }
  
  /* ★タイトルのスタイル設定（中央寄せ） */
  h2 {
    margin-top: 0;
    font-size: 20px;
    margin-bottom: 25px;
    text-align: center; /* タイトルテキストを中央揃えにする */
  }
  
  input[type="password"] { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { background-color: #0056b3; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 50%; }
  button:hover { background-color: #004494; }
  
  #hidden-content { display: none; }
  
  /* ★会員メニューのボタンのスタイル設定 */
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center; /* ボタン内のテキストと絵文字も中央に */
    background: #f1f1f1;
    padding: 15px;
    margin-bottom: 15px;
    text-decoration: none;
    color: #333;
    border-radius: 4px;
    font-weight: bold;
  }
  .link-btn:hover { background: #e2e2e2; }
  .link-btn span { margin-left: 10px; } /* 絵文字とテキストの間隔 */
  
  .error { color: red; font-size: 12px; display: none; margin-top: -10px; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="container" id="login-box">
  <img src="170262_0.webp" alt="川崎ヤング ロゴ" class="logo">
  <h2>川崎ヤング_会員専用ページ</h2>
  <p>パスワードを入力してください</p>
  <input type="password" id="pwd" placeholder="パスワード">
  <p class="error" id="error-msg">パスワードが間違っています</p>
  <button onclick="checkPassword()">ログイン</button>
</div>

<div class="container" id="hidden-content">
  <img src="170262_0.webp" alt="川崎ヤング ロゴ" class="logo">
  <h2>川崎ヤング_会員メニュー</h2>
  
  <a href="https://calendar.google.com/calendar/embed?src=kawasaki.young.baseball%40gmail.com&ctz=Asia%2FTokyo" target="_blank" class="link-btn">🗓<span>会員用予定表</span></a>
  <a href="https://forms.gle/2WD1noECBqp566sU9" target="_blank" class="link-btn">⚾️<span>用品購入フォーム</span></a>
  <a href="川崎ヤング_会則.pdf" target="_blank" class="link-btn">📄<span>会則（PDF）</span></a>
</div>

<script>
  function checkPassword() {
    var password = document.getElementById("pwd").value;
    // ★ご自身で設定したパスワードに変更してください
    if (password === "kyb2026") { 
      document.getElementById("login-box").style.display = "none";
      document.getElementById("hidden-content").style.display = "block";
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }
</script>

</body>
</html>
