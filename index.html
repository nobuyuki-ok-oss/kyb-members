<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員専用ページ</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
  .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
  input[type="password"] { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; }
  button { background-color: #0056b3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #004494; }
  #hidden-content { display: none; text-align: left; }
  .link-btn { display: block; background: #f1f1f1; padding: 12px; margin-bottom: 10px; text-decoration: none; color: #333; border-radius: 4px; text-align: center;}
  .link-btn:hover { background: #e2e2e2; }
  .error { color: red; font-size: 12px; display: none; margin-top: -10px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container" id="login-box">
  <h2>会員専用ページ</h2>
  <p>パスワードを入力してください</p>
  <input type="password" id="pwd" placeholder="パスワード">
  <p class="error" id="error-msg">パスワードが間違っています</p>
  <button onclick="checkPassword()">ログイン</button>
</div>

<div class="container" id="hidden-content">
  <h2>会員メニュー</h2>
  <a href="【https://calendar.google.com/calendar/embed?src=kawasaki.young.baseball%40gmail.com&ctz=Asia%2FTokyo】" target="_blank" class="link-btn">🗓 チームスケジュール</a>
  <a href="【https://forms.gle/2WD1noECBqp566sU9】" target="_blank" class="link-btn">⚾️ 用品購入フォーム</a>
  <a href="【https://www.netto.jp/kawasakiyoung-amicus/html_file/%E5%B7%9D%E5%B4%8E%E3%83%A4%E3%83%B3%E3%82%AF%E3%82%99_%E4%BC%9A%E5%89%87.pdf】" target="_blank" class="link-btn">📄 会則（PDF）</a>
</div>

<script>
  function checkPassword() {
    var password = document.getElementById("pwd").value;
    // ★ここが設定するパスワードです（例: kyb2026）
    if (password === "kyb2026") { 
      document.getElementById("login-box").style.display = "none";
      document.getElementById("hidden-content").style.display = "block";
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }
</script>

</body>
</html>
